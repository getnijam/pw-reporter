name: Publish

# Publishes @nijam/pw-reporter to npm. Trigger by publishing a GitHub Release
# (bump "version" in package.json first, then create a matching release/tag),
# or run manually via "Run workflow".
#
# Required repo secret: NPM_TOKEN — an npm automation token with publish access
# to the @nijam scope (Settings → Secrets and variables → Actions).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (public repo only)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # --access public: scoped (@nijam) packages are private by default.
      # --provenance: signed build attestation; needs a PUBLIC repo + id-token:write.
      #   If the repo is private, drop "--provenance".
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
